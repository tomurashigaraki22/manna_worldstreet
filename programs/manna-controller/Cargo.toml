[package]
name = "manna-controller"
version = "0.1.0"
description = "Minimal fixed-rate on-chain MNA mint and redemption controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "manna_controller"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "token_2022", "associated_token"] }
