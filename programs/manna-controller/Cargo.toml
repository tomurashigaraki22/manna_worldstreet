[package]
name = "manna-controller"
version = "0.1.0"
description = "Minimal fixed-rate on-chain MNA mint and redemption controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "manna_controller"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# anchor-spl is deliberately not a dependency: pulling it in links the whole
# spl-token-2022 crate (extension tables, StateWithExtensions) for what amounts
# to three CPIs and a handful of field reads. Those are hand-rolled in lib.rs
# against the SPL Token account layouts, which both Token and Token-2022 share.
anchor-lang = "0.32.1"
