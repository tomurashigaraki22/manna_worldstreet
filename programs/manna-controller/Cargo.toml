[package]
name = "manna-controller"
version = "0.1.0"
description = "Minimal fixed-rate on-chain MNA mint and redemption controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "manna_controller"

[features]
no-entrypoint = []
default = []

[dependencies]
# Deliberately bare: no anchor-lang, no anchor-spl. Deploy rent is charged per
# byte of the .so, and the framework's dispatch/serialization machinery cost
# more than the program itself. Instruction discriminators, account ordering,
# the config account layout, event encoding and error codes are all kept
# byte-compatible with the previous Anchor build, so the TS client is unchanged.
solana-program = "2.3"
